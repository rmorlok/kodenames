<div class="single-card-page">
    <div id="new-player">
        <mat-card appearance="outlined">
            <mat-card-content>
                <h1>Welcome to Kodenames!</h1>
                <form [formGroup]="editForm" style="display: flex; flex-direction: row;">
                    <mat-form-field style="flex: 1 1 100%;">
                        <mat-label>Enter your name</mat-label>
                        <input matInput formControlName="name" placeholder="Bob Dole">
                    </mat-form-field>
                </form>
            </mat-card-content>
            <mat-card-actions>
                <button
                        mat-flat-button
                        style="flex: 1 1 100%;"
                        color="primary"
                        [disabled]="!editForm.valid"
                        (click)="createPerson()">
                    Next&nbsp;&nbsp;
                    <mat-icon matSuffix>fast_forward</mat-icon>
                </button>
            </mat-card-actions>
        </mat-card>
    </div>
</div>
